<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self' https://uxsdddejthdpoxghuzca.supabase.co; img-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'"><title>運営管理窓口｜合同会社TSUNAGARI</title><link rel="stylesheet" href="style.css"></head><body><main><header><h1>JUN-IKU｜運営管理窓口</h1><p>運営権限を持つ担当者が、契約確認後の企業台帳・招待を管理します。</p></header><p id="notice" role="status" aria-live="polite"></p><section id="login"><h2>運営担当ログイン</h2><form id="login-form"><label>メールアドレス<input id="email" type="email" autocomplete="username" required></label><label>パスワード<input id="password" type="password" autocomplete="current-password" required></label><button>ログイン</button></form></section><section id="mfa" hidden><h2>追加認証</h2><p>登録済みの認証アプリのコードを入力してください。旧名MEGURIで登録した項目も使用できます。</p><form id="mfa-form"><label>認証アプリ<select id="factor"></select></label><label>6桁コード<input id="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required></label><button>確認する</button></form></section><section id="operations" hidden><p>企業台帳への登録は契約締結を意味しません。契約書・利用条件・担当者確認は別途完了してください。</p><button id="reauth" type="button">追加認証を更新</button><button id="refresh" type="button">企業一覧を再取得</button><h2>登録済みの企業</h2><div id="records"></div><h2>保留の照合</h2><button id="inspect-pending" type="button">台帳・監査と保留を照合</button><p id="pending-result" role="status"></p><label><input id="resolve-confirm" type="checkbox">照合結果を確認し、この保留だけ解決する</label><button id="resolve-pending" type="button" disabled>確認した保留を解決</button><h2>操作</h2><label>実行する操作<select id="action"></select></label><form id="command"><div id="fields"></div><label><input id="confirm" type="checkbox" required>対象企業と招待先を確認しました</label><button id="submit">確認して実行</button></form><p id="result" role="status"></p></section><button id="logout" hidden type="button">ログアウト</button><footer>台帳登録は契約締結ではありません。契約書・相手の権限・請求条件を担当者が確認してから操作します。外部メールは自動送信しません。</footer></main><script src="vendor/supabase.js"></script><script type="module" src="app.mjs"></script></body></html>
