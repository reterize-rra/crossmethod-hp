function device(content,cls=''){return `<div class="device ${cls}"><div class="device-screen"><span class="island"></span><div class="screen-status"><span>9:41</span><span>▮▮▮ ▰</span></div><div class="screen-scroll"><div class="screen-inner">${content}</div></div>${navHTML}</div></div>`;}
function radar(values,labels){const cx=100,cy=103,r=65;const pts=(scale)=>values.map((v,i)=>{const a=(-90+i*72)*Math.PI/180;return [cx+Math.cos(a)*r*scale*(v/100),cy+Math.sin(a)*r*scale*(v/100)]});const poly=p=>p.map(a=>a.join(',')).join(' ');const grid=[.25,.5,.75,1].map(s=>`<polygon class="radar-grid" points="${poly(pts.call(null,s).map((_,i)=>{let a=(-90+i*72)*Math.PI/180;return[cx+Math.cos(a)*r*s,cy+Math.sin(a)*r*s]}))}"/>`).join('');const loc=[[100,16],[178,86],[147,184],[51,184],[22,86]];return `<svg class="radar-svg" viewBox="0 0 200 202" role="img" aria-label="${labels.map((l,i)=>l+values[i]).join('、')}">${grid}${values.map((v,i)=>{let a=(-90+i*72)*Math.PI/180;return `<line class="radar-grid" x1="100" y1="103" x2="${cx+Math.cos(a)*r}" y2="${cy+Math.sin(a)*r}"/>`}).join('')}<polygon class="radar-fill" points="${poly(pts(1))}"/>${pts(1).map(p=>`<circle class="radar-dot" cx="${p[0]}" cy="${p[1]}" r="2.7"/>`).join('')}${labels.map((l,i)=>`<text x="${loc[i][0]}" y="${loc[i][1]}" text-anchor="middle" font-size="8" fill="#31584e" font-weight="700">${l}<tspan x="${loc[i][0]}" dy="10" fill="#d15a85">${values[i]}点</tspan></text>`).join('')}</svg>`;}
const colors=['#ce5681','#488ab6','#8055ac','#2e9287'];
function metricCard(title,val,i,desc='項目ごとの状態を振り返ります。'){return `<article class="screen-card" style="border-left-color:${colors[i%4]}"><span class="big" style="color:${colors[i%4]}" data-count="${val}">${val}</span><h4>${title}</h4><div class="bar"><span style="--value:${val}%;--bar:${colors[i%4]}"></span></div><p>${desc}</p></article>`;}
function employee(){return `<div class="tiny">EMPLOYEES / ANONYMOUS</div><h3 class="phone-title">働く人の状態</h3><p class="tiny">個人名や個人の点数は表示せず、集計範囲の傾向を確認します。</p><div class="score-tile"><small>働く人の状態</small><strong><span data-count="82.8">82.8</span><i>/100</i></strong><small>5領域の匿名平均</small></div><div class="radar-card"><div class="radar-label">5領域のバランス</div>${radar([83.8,79.8,82.8,80.8,86.8],['からだ','こころ','暮らし','活動','つながり'])}</div>${['からだ','こころ','暮らし','活動','つながり'].map((s,i)=>metricCard(s,[83.8,79.8,82.8,80.8,86.8][i],i)).join('')}`;}
function org(){return '<div class="tiny">ORGANIZATION</div><h3 class="phone-title">組織の項目別スコア</h3>'+['会社理解・納得','情報共有・変化対応','役割・裁量','現場業務'].map((s,i)=>metricCard(s,[82.8,75.8,80.8,68.8][i],i)).join('');}
function roles(){return '<div class="tiny">VOICE / DIFFERENCES</div><h3 class="phone-title">立場・入社時期による違い</h3>'+['新人の声','管理者の声','経営層の声'].map((s,i)=>metricCard(s,[78.4,77.2,83.8][i],i,'立場による見え方を振り返ります。')).join('');}
D.getElementById('hero-phones').innerHTML='<div class="phone-plane">'+device(org())+device(employee())+device(roles())+'</div>';
const stage=D.getElementById('hero-phones');function fitPhones(){const scale=Math.min(1.06,stage.clientWidth/840);stage.style.setProperty('--plane-scale',String(scale));stage.style.setProperty('height',String(550*scale+18)+'px','important');}fitPhones();if('ResizeObserver'in window)new ResizeObserver(fitPhones).observe(stage);else window.addEventListener('resize',fitPhones);

let clock=0,last=performance.now();function animate(now){clock+=Math.min(64,now-last);last=now;if(activeMotion&&!document.hidden)document.querySelectorAll('.screen-scroll').forEach((el,i)=>{const max=el.scrollHeight-el.clientHeight;if(max>0)el.scrollTop=(.5-.5*Math.cos((clock+i*1300)/4700))*max});requestAnimationFrame(animate)}requestAnimationFrame(animate);</script></body></html>
