<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self' https://uxsdddejthdpoxghuzca.supabase.co; img-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'"><title>運営管理窓口｜合同会社TSUNAGARI</title><link rel="stylesheet" href="style.css?v=layout6"></head><body><main><header><span class="wordmark">JUN-IKU</span><h1>企業管理窓口</h1><p>クロスメソッド™︎ 運営管理</p></header><p id="notice" role="status" aria-live="polite"></p><section id="login"><h2>運営担当ログイン</h2><form id="login-form"><label>メールアドレス<input id="email" type="email" autocomplete="username" required></label><label>パスワード<input id="password" type="password" autocomplete="current-password" required></label><button>ログイン</button></form></section><section id="mfa" hidden><h2>追加認証</h2><p>登録済みの認証アプリのコードを入力してください。旧名MEGURIで登録した項目も使用できます。</p><form id="mfa-form"><label>認証アプリ<select id="factor"></select></label><label>6桁コード<input id="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required></label><button>確認する</button></form></section><section id="operations" hidden>
  <nav id="work-nav" aria-label="業務メニュー">
    <button type="button" data-view="companies" aria-current="page">企業台帳</button>
    <button type="button" data-view="invites">招待</button>
    <button type="button" data-view="billing">請求・入金</button>
    <button type="button" data-view="settings">管理設定</button>
  </nav>
  <div class="section-head"><h2 id="view-title">企業台帳</h2><button id="refresh" type="button">一覧を更新</button></div>
  <div class="choices">
    <button type="button" data-action="createEnterprise" aria-controls="task" aria-expanded="false"><span>企業登録を開始</span><small>新しい企業と初期管理者を登録</small><b aria-hidden="true">→</b></button>
    <button type="button" data-action="createEnterpriseInvitation" aria-controls="task" aria-expanded="false"><span>招待コードを発行</span><small>登録済み企業に担当者・従業員を招待</small><b aria-hidden="true">→</b></button>
    <button type="button" data-action="editEnterprise" aria-controls="task" aria-expanded="false"><span>企業情報を編集</span><small>企業名・契約人数・支払方法</small></button>
    <button type="button" data-action="changeEnterpriseUsage" aria-controls="task" aria-expanded="false"><span>試用・有料の切替</span><small>対象企業と適用日を指定</small></button>
    <button type="button" data-action="saveBillingDraft" aria-controls="task" aria-expanded="false"><span>請求明細を作成</span><small>項目・数量・税抜単価を入力</small></button>
    <button type="button" data-action="issueBilling" aria-controls="task" aria-expanded="false"><span>請求書を発行</span><small>下書きと支払方法を確認</small></button>
    <button type="button" data-action="markBillingPaid" aria-controls="task" aria-expanded="false"><span>入金を記録</span><small>銀行振込の入金日時・照合情報を登録</small></button>
    <button type="button" data-action="terminateEnterprise" aria-controls="task" aria-expanded="false"><span>契約を終了</span><small>企業の利用を終了し、所属者のアクセスを停止</small></button>
    <button type="button" data-action="restoreEnterprise" aria-controls="task" aria-expanded="false"><span>契約を再開</span><small>試用で再開。担当者は再招待</small></button>
    <button type="button" data-action="reverseBankPayment" aria-controls="task" aria-expanded="false"><span>入金記録を訂正</span><small>銀行振込の誤登録を理由付きで未入金に戻す</small></button>
  </div>
  <select id="action" aria-label="実行する操作" hidden></select>
  <div id="task" hidden>
    <h2 id="task-title" tabindex="-1"></h2>
    <form id="command"><div id="fields"></div><label class="check"><input id="confirm" type="checkbox" required>対象と入力内容を確認しました</label><button id="submit">確認して実行</button></form>
  </div>
  <div id="result" role="status"></div>
  <div class="registry" id="company-panel"><div class="filters"><label>企業を検索<input id="company-search" type="search" placeholder="企業名・企業コード"></label><label>契約状態<select id="company-status"><option value="">すべて</option><option value="active">契約中</option><option value="terminated">契約終了</option><option value="deleted">削除済み</option></select></label></div><div id="records"></div><div id="company-pages" class="pager"></div></div>
  <section id="billing-panel" class="registry" hidden><div class="filters"><label>企業名・請求番号・請求月で検索<input id="bill-search" type="search"></label><label>請求状態<select id="bill-status"><option value="">すべて</option><option value="draft">下書き</option><option value="unpaid">未入金</option><option value="paid">入金済み</option></select></label></div><div id="bill-records"></div><div id="bill-pages" class="pager"></div></section>
  <details id="security-panel" hidden open><summary>認証・処理結果の確認</summary><button id="reauth" type="button">追加認証を更新</button><button id="inspect-pending" type="button">台帳・監査と保留を照合</button><p id="pending-result" role="status"></p><label class="check"><input id="resolve-confirm" type="checkbox">照合結果を確認し、この保留だけ解決する</label><button id="resolve-pending" type="button" disabled>確認した保留を解決</button></details>
</section><button id="logout" hidden type="button">ログアウト</button><footer>台帳登録は契約締結ではありません。契約書・相手の権限・請求条件を担当者が確認してから操作します。外部メールは自動送信しません。</footer></main><script src="vendor/supabase.js"></script><script type="module" src="app.mjs?v=layout6"></script></body></html>
