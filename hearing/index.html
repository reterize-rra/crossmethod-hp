<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
  <meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
  <meta name="referrer" content="no-referrer">
  <title>対話型従業員ヒアリング｜クロスメソッド™</title>
  <style>
    :root { color-scheme: light; --navy:#102a43; --teal:#0d6f73; --gold:#c6a55b; --line:#d9e2ec; --muted:#627d98; }
    * { box-sizing:border-box; }
    html, body { width:100%; min-height:100%; margin:0; }
    body { overflow:hidden; background:#f7fbfb; font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif; color:var(--navy); }
    .shell { position:fixed; inset:0; display:grid; grid-template-rows:4px 1fr; background:linear-gradient(145deg,#f5fbfa,#fbfaf5); }
    .accent { background:linear-gradient(90deg,var(--teal),#42aaa7 68%,var(--gold)); }
    iframe { width:100%; height:100%; border:0; background:#f7fbfb; }
    .loader, .setup { position:absolute; inset:4px 0 0; display:grid; place-items:center; padding:24px; background:linear-gradient(145deg,#f5fbfa,#fbfaf5); transition:opacity .22s ease,visibility .22s ease; }
    .loader.is-hidden { opacity:0; visibility:hidden; pointer-events:none; }
    .loader-card, .setup-card { width:min(460px,100%); padding:32px; border:1px solid rgba(13,111,115,.15); border-radius:22px; background:rgba(255,255,255,.95); box-shadow:0 18px 46px rgba(16,42,67,.10); text-align:center; }
    .mark { width:42px; height:42px; margin:0 auto 18px; border:4px solid #d8ecea; border-top-color:var(--teal); border-radius:50%; animation:spin .8s linear infinite; }
    .brand { color:var(--teal); font-size:12px; font-weight:900; letter-spacing:.12em; }
    h1 { margin:8px 0 10px; font-size:22px; line-height:1.5; }
    p { margin:0; color:var(--muted); font-size:14px; line-height:1.8; }
    code { display:block; margin-top:16px; padding:10px; overflow-wrap:anywhere; border-radius:10px; background:#f2f6f8; color:#9b2c2c; text-align:left; }
    @keyframes spin { to { transform:rotate(360deg); } }
    @media (max-width:640px) { .loader-card,.setup-card { padding:25px 20px; } }
  </style>
</head>
<body>
  <main class="shell">
    <div class="accent" aria-hidden="true"></div>
    <iframe id="hearingApp" title="クロスメソッド™ 対話型従業員ヒアリング" allow="clipboard-write" loading="eager"></iframe>
  </main>
  <div id="loader" class="loader" role="status" aria-live="polite">
    <div class="loader-card">
      <div class="mark" aria-hidden="true"></div>
      <div class="brand">CROSS METHOD™</div>
      <h1>ヒアリングシステムを準備しています</h1>
      <p>画面が表示されるまで、そのままお待ちください。</p>
    </div>
  </div>
  <div id="setup" class="setup" hidden>
    <div class="setup-card">
      <div class="brand">SETUP REQUIRED</div>
      <h1>WEBアプリURLが未設定です</h1>
      <p>HP反映用ファイルのURL設定を確認してください。</p>
      <code>__CM_HEARING_WEB_APP_URL__</code>
    </div>
  </div>
  <script>
    (function () {
      const appUrl = 'https://script.google.com/macros/s/AKfycbwkkowgFxVTQdsddhVRXsImHMAtLd5q_vmrzbxPWgwG80_utaK1wGW1R92n6aqFY-KI/exec';
      const frame = document.getElementById('hearingApp');
      const loader = document.getElementById('loader');
      const setup = document.getElementById('setup');
      if (!/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec(?:\?.*)?$/.test(appUrl)) {
        loader.hidden = true;
        setup.hidden = false;
        return;
      }
      frame.addEventListener('load', function () {
        window.setTimeout(function () { loader.classList.add('is-hidden'); }, 180);
      }, { once:true });
      frame.src = appUrl;
      window.setTimeout(function () { loader.classList.add('is-hidden'); }, 12000);
    }());
  </script>
</body>
</html>
